# TLS-terminating proxy (Caddy obtains certificates automatically) in front of the SCI server.
# 1. cp deploy/env.example deploy/.env  and fill it in     2. put the GitHub App private key at deploy/github-app.pem
# 3. set SCI_DOMAIN in .env to a DNS name that points at this host     4. docker compose -f deploy/docker-compose.yml up -d
services:
  sci:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      SCI_PRIVATE_KEY_FILE: /run/secrets/github_app_key
    secrets: [github_app_key]
    volumes: [sci-data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [SCI_DOMAIN]
    env_file: .env
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]
    depends_on: [sci]
secrets:
  github_app_key:
    file: ./github-app.pem
volumes:
  sci-data: {}
  caddy-data: {}
