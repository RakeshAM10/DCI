# Runs the composite action itself on a real GitHub runner against a throwaway breaking pull request
# (tools/make_demo.py). This is the end-to-end proof that installation, git history handling, annotations,
# outputs and SARIF work on GitHub's infrastructure, not just in our tests.
name: SCI self-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build a throwaway repository with a base branch and a breaking PR branch
        run: python tools/make_demo.py "$GITHUB_WORKSPACE/.selftest"
      - name: Run the action on it
        id: sci
        continue-on-error: true       # the demo PR must FAIL; the next step checks that it did, and why
        uses: ./
        with:
          working-directory: .selftest/work
          base-ref: main
          comment: "false"
      - name: Check the result
        env:
          OUTCOME: ${{ steps.sci.outcome }}
          VERDICT: ${{ steps.sci.outputs.verdict }}
          BLOCKING: ${{ steps.sci.outputs.blocking-count }}
          JSON_PATH: ${{ steps.sci.outputs.json-path }}
          SARIF_PATH: ${{ steps.sci.outputs.sarif-path }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "fail"
          test "$BLOCKING" -ge 5
          test -s "$SARIF_PATH"
          python - <<'PY'
          import json, os
          ids = {f["rule_id"] for f in json.load(open(os.environ["JSON_PATH"]))["findings"]}
          want = {"DCI101", "API101", "GQL101", "PRT101", "PRT111"}
          missing = want - ids
          assert not missing, f"missing findings: {sorted(missing)} (got {sorted(ids)})"
          print("all five checks reported:", sorted(ids))
          PY
