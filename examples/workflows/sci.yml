# Copy to .github/workflows/sci.yml. Runs every SCI check (database migrations, REST/Swagger, GraphQL, gRPC) on each pull request.
name: SCI change check
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # post/update the PR comment
  security-events: write # upload SARIF to code scanning (remove the last step if unused)

concurrency:
  group: sci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sci
        uses: YOUR-ORG/sci@v1     # pin to a full commit SHA in production
        with:
          checks: db,api,graphql,proto
          # Optional production evidence (files already in the workspace, for example exported by a scheduled job):
          # runtime-queries: evidence/pg_stat_statements.csv
          # api-access-logs: evidence/access.log
          # runtime-blocks: "false"   # "true" = you vouch the evidence is current, so it can fail the check
      - name: Upload SARIF
        if: always() && steps.sci.outputs.sarif-path != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: ${{ steps.sci.outputs.sarif-path }}
          category: sci
