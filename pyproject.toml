[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dci"
version = "1.0.0"
description = "Database Change Intelligence: static, evidence-linked compatibility checks for PostgreSQL migrations (Alembic / SQL) against SQLAlchemy consumers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["sqlglot>=27,<32"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
dci = "dci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
