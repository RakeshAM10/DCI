[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dci"
version = "1.0.0"
description = "Software Change Intelligence: evidence-linked pull-request checks (PostgreSQL migrations, OpenAPI contracts) with production evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["sqlglot>=27,<32", "pyyaml>=6,<7", "graphql-core>=3.2,<3.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
dci = "dci.cli:main"
sci = "sci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
